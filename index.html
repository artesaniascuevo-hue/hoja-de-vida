<!DOCTYPE html>
<!-- Indica que estamos utilizando HTML5 -->
<html lang="es">
<!-- Inicia el documento HTML e indica que el idioma es español -->

<head>
    <!-- Aquí comienza la configuración de la página -->
    <meta charset="UTF-8">
    <!-- Permite utilizar tildes, ñ y caracteres especiales -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adapta la página a celulares, tablets y computadoras -->

    <title>Hoja de Vida - LAURA</title>
    <!-- Define el título que aparece en la pestaña del navegador -->
</head>
<!-- Cierra la sección de configuración -->

<body>
    <!-- Aquí comienza el contenido visible de la página -->

    <h1>HOJA DE VIDA</h1>
    <!-- Crea el título principal de la página -->

    <img src="foto.jpg" alt="Fotografía de Laura Marquez Subelza" width="500">
    <!-- Inserta la fotografía foto.jpg que está en la misma carpeta -->
    <!-- src indica el nombre o ubicación del archivo de imagen -->
    <!-- alt proporciona una descripción de la fotografía -->
    <!-- width establece el ancho de la imagen en 200 píxeles -->

    <h2>Datos personales</h2>
    <!-- Crea un subtítulo de segundo nivel -->

    <p>
        <strong>Nombre:</strong>
        Laura Marquez Subelza
    </p>
    <!-- p crea un párrafo y strong coloca la palabra Nombre en negrita -->

    <p>
        <strong>Dirección:</strong>
        Barrio Urkupiña
    </p>
     <p>
        <strong>Profesión:</strong>
        Profesora
    </p>
    <!-- Muestra la dirección de Laura y resalta la etiqueta en negrita -->

</body>
<!-- Cierra el contenido visible de la página -->

</html>
<!-- Finaliza el documento HTML -->
